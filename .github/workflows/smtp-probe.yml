name: smtp-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: send
        run: |
          python3 - <<'PY'
          import smtplib, datetime
          C = chr(58)
          msg = "\n".join([
              "From" + C + " probe@gh-runner.local",
              "To" + C + " labtest54vhlwv6@maildrop.cc",
              "Subject" + C + " GH SMTP probe",
              "Date" + C + " " + str(datetime.datetime.utcnow()),
              "",
              "probe 123456",
              "",
          ])
          s = smtplib.SMTP("mx.maildrop.cc", 25, timeout=30)
          s.sendmail("probe@gh-runner.local", ["labtest54vhlwv6@maildrop.cc"], msg)
          s.quit()
          print("SEND OK")
          PY
